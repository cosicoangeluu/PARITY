name: Keep alive and clean up

# Free Supabase projects pause after 7 days without activity. This pings the app once a day,
# which touches the database and deletes payment-proof photos older than 30 days.
# Needs repository secrets: SITE_URL (e.g. https://parity.vercel.app) and CRON_SECRET.

on:
  schedule:
    - cron: "17 2 * * *" # 10:17 Manila time, every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron"
